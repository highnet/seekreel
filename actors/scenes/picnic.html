<!doctype html>
<meta charset="utf-8">
<title>seekreel actors — picnic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden;
    background: linear-gradient(180deg, #c8b4e6 0%, #f5bfd0 34%, #ffd3b4 62%, #ffe8c4 100%); }
</style>
<script src="../vendor/motion.js"></script>
<script type="module">
/*
 * Picnic: two blobs on an island, a box of fries, and a dog that steals one.
 * Eight seconds, everything computed from t.
 */
import { setupScene } from "../scene.js";
const { THREE, kit, scene, camera, t, span, springAt, blink, hop, mix, easeInOut, easeOut, finish } = await setupScene();

scene.add(kit.sea({ ripple: (t * 0.22) % 1 }));
const land = kit.island(); scene.add(land);
const palm = kit.palm({ sway: Math.sin(t * 1.3) * 0.04 }); palm.position.set(-3.2, 0, -1.7); land.add(palm);
const cot = kit.cottage(); cot.position.set(1.8, 0, -2.4); cot.rotation.y = -0.3; land.add(cot);
const blanket = kit.blanket(); blanket.position.set(-0.4, 0, 1.4); land.add(blanket);

/* the dog grabs a fry at 3.2s */
const STEAL = 3.2;
const box = kit.fryBox({ fries: t < STEAL ? 5 : 4 }); box.position.set(-0.4, 0, 1.4); land.add(box);

const shock = span(STEAL, STEAL + 0.3) * (1 - span(5.2, 5.6));
const me = kit.glasses(kit.cap(kit.blob({ color: kit.PALETTE.butter, open: blink(0), eyes: 1 + 0.6 * shock, squash: Math.sin(t * 2.6) * 0.02 })));
me.group.position.set(-1.6, 0, 1.3); me.group.rotation.y = 0.3; land.add(me.group);
const laughing = t > 4 && t < 6.5;
const her = kit.hairBun(kit.blob({ color: kit.PALETTE.rose, cheek: "#ff6f8e", open: blink(1.1), happy: laughing,
  mouth: laughing ? 2.3 : 1, squash: laughing ? -Math.abs(Math.sin(t * 18)) * 0.1 : 0 }));
her.group.position.set(0.8, 0, 1.4); her.group.rotation.y = -0.3; land.add(her.group);

/* the dog: in from the right, grab, and a victory lap */
const run = hop(2.2, STEAL, 4, 0.3), lap = span(STEAL + 0.2, 7.6);
let dx, dz, face;
if (t < STEAL) { dx = mix(3.6, 0.1, easeInOut(run.u)); dz = mix(2.4, 1.95, easeInOut(run.u)); face = -Math.PI / 2; }
else { const a = lap * Math.PI * 2; dx = Math.sin(a) * 2.9 + 0.1 * (1 - lap); dz = Math.cos(a) * 2.2 - 0.25; face = a + Math.PI / 2; }
const dog = kit.dog({ wag: Math.sin(t * 14) * 0.5, ears: 0.35 + (run.y > 0 ? 0.3 : 0), open: blink(2.3, 4.1) });
dog.group.position.set(dx, run.y + (t > STEAL && t < 7.6 ? Math.abs(Math.sin(t * 12)) * 0.12 : 0), dz);
dog.group.rotation.y = face;
land.add(dog.group);
if (t >= STEAL - 0.25 && t < 7.8) {
  const f = kit.fry();
  dog.group.updateMatrixWorld(true);
  if (t < STEAL) {
    const u = easeOut(span(STEAL - 0.25, STEAL));
    f.position.lerpVectors(new THREE.Vector3(-0.4, 0.45, 1.4), dog.mouth.clone().applyMatrix4(dog.group.matrixWorld), u);
  } else {
    f.position.copy(dog.mouth.clone().applyMatrix4(dog.group.matrixWorld));
    f.rotation.set(Math.PI / 2, face + Math.PI / 2, 0);
  }
  scene.add(f);
}
/* hearts, because she thinks it is hilarious */
for (let i = 0; i < 4; i++) {
  const e = t - 4.2 - i * 0.25;
  if (e <= 0 || e > 2.4) continue;
  const h = kit.heart(0.14 * springAt(e, 0, 1, { stiffness: 360, damping: 10 }) + 0.0001, i % 2 ? "#ffcf4a" : kit.PALETTE.pink);
  h.position.set(0.8 + (i - 1.5) * 0.3, 1.5 + e * 0.8, 1.4);
  scene.add(h);
}

const push = easeInOut(span(0, 8));
camera.position.set(mix(0.4, -0.2, push), mix(3.2, 2.4, push), mix(9.4, 7.6, push));
camera.lookAt(-0.2, 0.6, 1.0);
await finish();
</script>
