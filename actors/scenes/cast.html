<!doctype html>
<meta charset="utf-8">
<title>seekreel actors — the cast</title>
<style>
  @font-face { font-family: "Bricolage"; src: url("../vendor/bricolage.ttf") format("truetype"); font-weight: 200 800; font-stretch: 75% 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(180deg, #ffe6ee, #fff6ec); font-family: "Bricolage", system-ui, sans-serif; }
  .tag { position: absolute; transform: translate(-50%, 0); font-size: 2.4vh; font-weight: 650; color: #3a1f3d; white-space: nowrap; }
  h1 { position: absolute; top: 6vh; width: 100%; text-align: center; font-size: 6vh; font-weight: 800; font-stretch: 85%; letter-spacing: -.03em; color: #e0607e; }
</style>
<h1>The cast</h1>
<script src="../vendor/motion.js"></script>
<script type="module">
/*
 * A cast sheet: every character and accessory in the kit on one turntable,
 * each popping in on its own spring, labelled with the call that builds it.
 */
import { setupScene } from "../scene.js";
const { THREE, kit, scene, camera, t, springAt, blink, toScreen, finish } = await setupScene({ fog: null });

const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), kit.toon("#f8d5de"));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const turn = Math.sin(t * 0.8) * 0.35;
const CAST = [
  { tag: "blob + cap + glasses", make: () => kit.glasses(kit.cap(kit.blob({ color: kit.PALETTE.butter, open: blink(0) }))) },
  { tag: "blob + hairBun",       make: () => kit.hairBun(kit.blob({ color: kit.PALETTE.rose, cheek: "#ff6f8e", open: blink(1.1) })) },
  { tag: "blob + bow",           make: () => kit.bow(kit.blob({ color: "#b6a4e6", happy: true, blush: 0.8 })) },
  { tag: "blob + sprout",        make: () => kit.sprout(kit.blob({ color: "#9fd3a0", open: blink(2.2), mouth: 1 + Math.abs(Math.sin(t * 9)) }), Math.sin(t * 3) * 0.1) },
  { tag: "baby: curl + pacifier", scale: 0.5, make: () => kit.pacifier(kit.curl(kit.blob({ color: kit.PALETTE.peach, cheek: "#ff9a9a", open: blink(0.6) }))) },
  { tag: "dog",                  make: () => kit.dog({ wag: Math.sin(t * 14) * 0.5, ears: 0.35 + Math.sin(t * 7) * 0.08, open: blink(2.3, 4.1) }) },
];

const labels = [];
CAST.forEach((c, i) => {
  const s = springAt(t - 0.2 - i * 0.18, 0, 1, { stiffness: 320, damping: 11 });
  const built = c.make();
  const g = built.group;
  const x = (i - (CAST.length - 1) / 2) * 1.5;
  g.position.set(x, 0, 0);
  g.rotation.y = turn;
  g.scale.setScalar(Math.max(0.0001, s * (c.scale ?? 1)));
  scene.add(g);
  labels.push([c.tag, new THREE.Vector3(x, -0.12, 0.2), s]);
});

camera.position.set(0, 1.5, 8.8);
camera.lookAt(0, 0.55, 0);

for (const [tag, at, s] of labels) {
  const [x, y] = toScreen(at);
  const el = document.createElement("div");
  el.className = "tag"; el.textContent = tag;
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.opacity = String(Math.min(1, s));
  document.body.append(el);
}
await finish();
</script>
