<!doctype html>
<meta charset="utf-8">
<title>seekreel actors — gallery</title>
<style>
  @font-face { font-family: "Bricolage"; src: url("../vendor/bricolage.ttf") format("truetype"); font-weight: 200 800; font-stretch: 75% 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #f8d5de; }
</style>
<script src="../vendor/motion.js"></script>
<script type="module">
/*
 * Gallery: a pink museum wall of placeholder paintings in gold frames, a slow
 * pan, and three visitors waiting at an empty frame. Swap placeholderArt()
 * for your own textures (a THREE.TextureLoader promise) to hang real photos.
 */
import { setupScene } from "../scene.js";
const { THREE, kit, scene, camera, t, span, springAt, blink, mix, easeInOut, finish } = await setupScene({ fog: null, shadows: false });

await document.fonts.load('700 48px "Bricolage"');
const TITLES = [
  ["Untitled No. 1", "oil on toast"], ["Morning", "coffee, mostly"], ["The Picnic", "fries on canvas"],
  ["Bossa Nova", "sound, framed"], ["Two Blobs", "mixed media"], ["Getaway", "sun, sea, sleep"],
  ["Soft Hours", "pink on pink"], ["Still Life", "with dog"],
];
const pieces = TITLES.map(([title, line], i) => ({
  texture: kit.placeholderArt(i + 1), title, line,
  x: Math.floor(i / 2) * 1.75, y: i % 2 ? 1.0 : 2.55,
}));
pieces.push({ title: "Coming Soon", line: "a new masterpiece", x: 7.0, y: 2.05, h: 0.95, beat: 1 + Math.sin(t * 5) * 0.06 });
const wall = kit.gallery({ pieces, font: '"Bricolage"' });
scene.add(wall);

/* visitors at the last frame */
const come = springAt(t - 5.4, 0, 1, { stiffness: 300, damping: 12 });
if (come > 0.001) {
  const a = kit.glasses(kit.cap(kit.blob({ color: kit.PALETTE.butter, happy: t > 6.2, blush: 0.9 })));
  const b = kit.hairBun(kit.blob({ color: kit.PALETTE.rose, cheek: "#ff6f8e", happy: t > 6.2, blush: 1 }));
  const c = kit.pacifier(kit.curl(kit.blob({ color: kit.PALETTE.peach, cheek: "#ff9a9a", open: blink(0.6) })));
  [[a, 6.3, 0.95, 0.62, 0.15], [b, 7.7, 0.95, 0.62, -0.15], [c, 7.0, 1.12, 0.36, 0]].forEach(([bb, x, z, s, ry]) => {
    bb.group.position.set(x, 0, z); bb.group.rotation.y = ry; bb.group.scale.setScalar(s * come); wall.add(bb.group);
  });
}

const walk = easeInOut(span(0.6, 5.2));
const push = easeInOut(span(5.0, 8));
const cx = mix(0, 7.0, walk);
camera.position.set(cx, mix(1.75, 1.3, push), mix(4.6, 5.8, push));
camera.lookAt(cx, mix(1.75, 1.35, push), 0);
await finish();
</script>
