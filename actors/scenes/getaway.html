<!doctype html>
<meta charset="utf-8">
<title>seekreel actors — getaway</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden;
    background: linear-gradient(180deg, #c8b4e6 0%, #f5bfd0 34%, #ffd3b4 62%, #ffe8c4 100%); }
</style>
<script src="../vendor/motion.js"></script>
<script type="module">
/*
 * Getaway: a little plane crosses the sea and the camera settles on a beach.
 */
import { setupScene } from "../scene.js";
const { THREE, kit, scene, camera, t, span, springAt, blink, mix, mixColor, easeInOut, easeOut, finish } = await setupScene({ fog: [26, 60] });

scene.add(kit.sea({ ripple: (t * 0.22) % 1 }));
const BEACH = new THREE.Vector3(16, 0, -6);
const beach = kit.beach(); beach.position.copy(BEACH); scene.add(beach);

/* two blobs on the sand, one slowly getting sunburnt */
const burn = span(5.5, 7.5);
const a = kit.glasses(kit.cap(kit.blob({ color: mixColor(kit.PALETTE.butter, "#ff7f66")(burn), open: blink(0), eyes: 1 + 0.5 * burn })));
a.group.position.set(-0.9, 0, 0.9); a.group.rotation.y = 0.25; beach.add(a.group);
const b = kit.hairBun(kit.blob({ color: kit.PALETTE.rose, cheek: "#ff6f8e", open: blink(1.1), happy: burn > 0.5, mouth: burn > 0.5 ? 2.2 : 1 }));
b.group.position.set(0.9, 0, 0.9); b.group.rotation.y = -0.25; beach.add(b.group);
const baby = kit.curl(kit.blob({ color: kit.PALETTE.peach, cheek: "#ff9a9a", mouth: 1 + Math.abs(Math.sin(t * 20)) * 0.8 }));
baby.group.scale.setScalar(0.5); baby.group.position.set(0, 0, 1.6); beach.add(baby.group);
const slice = kit.melonSlice(); slice.position.set(0.42, 0.5, 0.35); slice.rotation.set(0.2, -0.4, -0.5); baby.group.add(slice);

/* the flight */
const from = new THREE.Vector3(-8, 3.4, 4), to = BEACH.clone().add(new THREE.Vector3(0, 3.2, 0));
const u = easeInOut(span(0, 4.2));
const at = (k) => new THREE.Vector3().lerpVectors(from, to, k).add(new THREE.Vector3(0, Math.sin(k * Math.PI) * 1.2, 0));
const pos = at(u);
if (t < 4.3) {
  const plane = kit.plane();
  plane.position.copy(pos);
  plane.rotation.y = Math.atan2(to.x - from.x, to.z - from.z);
  plane.rotation.z = Math.sin(t * 3) * 0.05;
  scene.add(plane);
  for (let i = 1; i <= 10; i++) {
    const k = u - i * 0.035;
    if (k <= 0) break;
    const puff = new THREE.Mesh(new THREE.SphereGeometry(0.22 * (1 - i / 12), 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 * (1 - i / 11) }));
    puff.position.copy(at(k));
    scene.add(puff);
  }
}
for (let c = 0; c < 4; c++) {
  const cl = kit.cloud({ seed: 5 + c });
  cl.position.set(-12 + c * 9 + t * 0.2, 7 + (c % 2) * 2, -14 - c * 2);
  scene.add(cl);
}

if (t < 4.3) {
  const side = new THREE.Vector3(to.z - from.z, 0, -(to.x - from.x)).normalize();
  camera.position.copy(pos).add(side.multiplyScalar(-6.5)).add(new THREE.Vector3(0, 1.0, 0));
  camera.lookAt(pos.clone().add(new THREE.Vector3(0, -0.4, 0)));
} else {
  const k = easeOut(span(4.3, 8));
  camera.position.set(BEACH.x + mix(0.4, 0.2, k), mix(2.6, 2.0, k), BEACH.z + mix(8.2, 6.6, k));
  camera.lookAt(BEACH.x, 0.9, BEACH.z + 0.4);
}
await finish();
</script>
