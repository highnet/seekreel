    background: var(--cream); transform: translateX(-50%) rotate(45deg); border-radius: .2vh;

  #captions { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 7.5vh; pointer-events: none; }

    position: absolute; bottom: 7.5vh; left: 8vw; right: 8vw;

/*
 * Fries for Two — an anniversary film for Anna.
 *
 * A seekreel stage: everything on screen is computed from `t`. Framer Motion
 * (the `motion` package) supplies the springs, easings and colour mixing, but
 * its spring is *sampled* at an elapsed time rather than run on a clock, so
 * frame N is the same picture every time it is drawn.
 */
import * as THREE from "./three.module.js";

const { spring, interpolate, mix, mixColor, easeInOut, easeOut, easeIn, cubicBezier } = window.Motion;

const rawT = parseFloat(new URLSearchParams(location.search).get("t") || "0");
/*
 * "Adventures" was added after the rest of the film was timed, so it is spliced
 * in: 68–84s of the video is its own scene, and everything written before it
 * keeps its original story time `t` (video time minus sixteen seconds after the
 * insert). `clock` is plain video time, for idle motion that should never stop.
 */
const ADV = 68, ADV_LEN = 16;
const inAdv = rawT >= ADV && rawT < ADV + ADV_LEN;
const t = rawT < ADV ? rawT : inAdv ? ADV - 0.03 : rawT - ADV_LEN;
const clock = rawT;
const W = innerWidth, H = innerHeight;

// ---------------------------------------------------------------------------
// helpers
// ---------------------------------------------------------------------------
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const span = (a, b, x = t) => clamp01((x - a) / (b - a));
const within = (a, b) => t >= a && t < b;
const TAU = Math.PI * 2;

/* A Motion spring, sampled `sec` seconds after it was let go. */
function springAt(sec, from = 0, to = 1, opts = {}) {
  if (sec <= 0) return from;
  const g = spring({ keyframes: [from, to], stiffness: 260, damping: 14, mass: 1, ...opts });
  return g.next(sec * 1000).value;
}
/* Pop in at `a`, drop out at `b`. */
function popInOut(a, b, opts, outDur = 0.35, time = t) {
  if (time < a || time > b + outDur) return 0;
  const inV = springAt(time - a, 0, 1, opts);
  const out = easeIn(span(b, b + outDur, time));
  return inV * (1 - out);
}

/* Seeded random, so the confetti lands in the same place every frame. */
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

/* Keyframe tracks: [{t, p:[x,z,y?], hops?, ry?}] → position at time t. */
function track(keys, time = t) {
  if (time <= keys[0].t) return { x: keys[0].p[0], z: keys[0].p[1], y: keys[0].p[2] || 0, air: 0, moving: false, dir: 0 };
  for (let i = 1; i < keys.length; i++) {
    const a = keys[i - 1], b = keys[i];
    if (time < b.t) {
      const u = (time - a.t) / (b.t - a.t);
      const e = b.hops ? u : easeInOut(u);
      const x = mix(a.p[0], b.p[0], e), z = mix(a.p[1], b.p[1], e);
      const y = mix(a.p[2] || 0, b.p[2] || 0, e);
      const moved = Math.hypot(b.p[0] - a.p[0], b.p[1] - a.p[1]) > 0.01 || (b.p[2] || 0) !== (a.p[2] || 0);
      let air = 0;
      if (b.hops) air = Math.abs(Math.sin(Math.PI * b.hops * u)) * (b.hh ?? 0.55);
      return { x, z, y: y + air, air, moving: moved, dir: Math.atan2(b.p[0] - a.p[0], b.p[1] - a.p[1]), hopU: b.hops ? (b.hops * u) % 1 : 0 };
    }
  }
  const l = keys[keys.length - 1];
  return { x: l.p[0], z: l.p[1], y: l.p[2] || 0, air: 0, moving: false, dir: 0 };
}

function cameraAt(time) {
  let a = CAM[0], b = CAM[0];
  for (let i = 1; i < CAM.length; i++) {
    if (time < CAM[i].t) { a = CAM[i - 1]; b = CAM[i]; break; }
    a = b = CAM[i];
  }
  if (a === b) return { p: a.p, l: a.l };
  const u = easeInOut(clamp01((time - a.t) / (b.t - a.t)));
  return {
    p: a.p.map((v, i) => mix(v, b.p[i], u)),
    l: a.l.map((v, i) => mix(v, b.l[i], u)),
  };
}

function nightAt(time) {
  if (time >= 108.4 && time < 122.8) {
    const u = (time - 108.4) / 14.4;              // two days go by
    return 0.5 - 0.5 * Math.cos(u * TAU * 2);
  }
  if (time >= 68 && time < 104) return 0.08;
  if (time >= 136) return 0.18 * span(136, 144, time);

}

// --- blobs -----------------------------------------------------------------
function reactions(who) {
  const out = { squash: 0, eyes: 1, blush: 0.35, happy: 0, mouth: 1, tilt: 0 };
  const now = who.startsWith("adv") ? rawT : t;
  for (const r of REACT[who] || []) {
    const e = now - r.at;
    if (e < 0 || e > r.len + 0.6) continue;
    const on = popInOut(r.at, r.at + r.len, { stiffness: 320, damping: 16 }, 0.35, now);
    if (r.k === "chew")  { out.squash += Math.sin(e * 22) * 0.07 * on; out.mouth = 1 + Math.abs(Math.sin(e * 22)) * 0.8 * on; }
    if (r.k === "talk")  { out.mouth = 1 + Math.abs(Math.sin(e * 16)) * 1.3 * on; }
    if (r.k === "laugh") { out.squash += Math.abs(Math.sin(e * 18)) * 0.12 * on; out.happy = Math.max(out.happy, on); out.mouth = 1 + 1.3 * on; out.tilt = Math.sin(e * 9) * 0.1 * on; }
    if (r.k === "shock") { out.eyes = 1 + 0.75 * on; out.squash -= 0.1 * on; }
    if (r.k === "blush") { out.blush = Math.max(out.blush, 0.35 + 0.65 * on); }
    if (r.k === "swoon") { out.happy = Math.max(out.happy, on); out.blush = Math.max(out.blush, 1 * on); out.tilt = Math.sin(e * 2.2) * 0.12 * on; }
    if (r.k === "shy")   { out.happy = Math.max(out.happy, on); out.blush = Math.max(out.blush, 1.1 * on); out.tilt = Math.sin(e * 1.6) * 0.08 * on; }
  }
  return out;
}

/* Everyone blinks, each on their own beat. */
const blink = (offset, every = 3.7) => ((clock + offset) % every) < 0.13 ? 0.12 : 1;

function blob({ color, cheek = "#ff8fa3", who, pos, scale = 1, parent = island }) {
  const g = new THREE.Group();
  g.position.set(pos.x, pos.y, pos.z);
  g.scale.setScalar(scale);
  parent.add(g);

  const re = reactions(who);
  const breathe = Math.sin(clock * 2.6 + (who.endsWith("anna") ? 1.3 : who.endsWith("baby") ? 2.1 : 0)) * 0.025;
  /* squash & stretch across a hop: tall in the air, squat as it lands */
  let hop = 0;
  if (pos.air > 0.02) hop = 0.12 * Math.min(1, pos.air * 2);
  else if (pos.moving && pos.hopU !== undefined) hop = -0.1 * Math.sin(Math.PI * (pos.hopU || 0));
  const sy = 1 + breathe + hop - re.squash;
  const sxz = 1 / Math.sqrt(Math.max(0.5, sy));

  const body = add(new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 22), toon(color)), g);
  body.scale.set(sxz, 1.12 * sy, sxz);
  body.position.y = 0.55 * 1.12 * sy;

  const face = new THREE.Group();
  face.position.y = body.position.y + 0.08 * sy;
  g.add(face);
  const facing = pos.moving ? pos.dir : (pos.face ?? 0);
  g.rotation.y = facing;
  g.rotation.z = re.tilt;

  /* eyes: dots, or happy arcs */
  const eyeOpen = blink(who.endsWith("anna") ? 1.1 : who.endsWith("me") ? 0 : 2.3) * re.eyes;
  for (const side of [-1, 1]) {
    if (re.happy > 0.5) {
      const arc = add(new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.022, 6, 12, Math.PI), toon("#2b1a2e")), face, false);
      arc.position.set(side * 0.19 * sxz, 0.06, 0.5 * sxz);
    } else {
      const eye = add(new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 10), toon("#2b1a2e")), face, false);
      eye.position.set(side * 0.19 * sxz, 0.05, 0.5 * sxz);
      eye.scale.set(re.eyes, 1.25 * eyeOpen, 0.6);
      const glint = add(new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff })), face, false);
      glint.position.set(side * 0.19 * sxz + 0.02, 0.08 * eyeOpen + 0.02, 0.54 * sxz);
      glint.visible = eyeOpen > 0.5;
    }
    const blush = add(new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 8), toon(cheek, { transparent: true, opacity: 0.85 })), face, false);
    blush.position.set(side * 0.3 * sxz, -0.07, 0.43 * sxz);
    blush.scale.set(1.2 * (0.6 + re.blush * 0.6), 0.6 * (0.6 + re.blush * 0.6), 0.5);
  }
  /* mouth: a small smile that opens to talk, chew and laugh */
  const mouth = add(new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.018, 6, 14, Math.PI), toon("#2b1a2e")), face, false);
  mouth.rotation.z = Math.PI;
  mouth.position.set(0, -0.08, 0.53 * sxz);
  mouth.scale.set(1, re.mouth, 1);

  return { g, body, face, sxz, top: body.position.y * 2 };
}

function me() {
  const pos = track(ME_KEYS);
  pos.face = within(58.2, 68) || within(124.6, 144) ? 0.35 : 0.2;
  if (within(72, 104)) pos.face = 0.5;
  const b = blob({ color: "#ffd27a", who: "me", pos });

  if (within(53.8, 57.8)) {

    paper.position.set(0, 0.55, 0.62);

    const medal = new THREE.Group();

/* The future: a few grey hairs arrive, and leave again when we come back to now. */
function greyHair(b, sides = false) {
  if (!within(113.3, 124)) return;
  const on = springAt(t - 113.3, 0, 1, { stiffness: 300, damping: 12 });
  for (let i = 0; i < 3; i++) {
    const tuft = add(new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), toon("#f2eef5")), b.g);
    if (sides) tuft.position.set((i - 1) * 0.5, b.top * 0.62, 0.12 - Math.abs(i - 1) * 0.1);
    else tuft.position.set(-0.14 + i * 0.14, b.top - 0.1 - Math.abs(i - 1) * 0.04, 0.05);
    tuft.scale.setScalar(on);
  }
}

function baby() {
  const pos = track(BABY_KEYS);
  pos.face = within(97, 106) ? -0.5 : within(107.5, 138) ? -0.6 : 0.3;
  const b = blob({ color: "#ffe0c8", cheek: "#ff9a9a", who: "baby", pos, scale: 0.5 });
  let appear = 1;
  if (t < 41.2) appear = 0;
  else if (t < 43) appear = springAt(t - 41.2, 0, 1, { stiffness: 380, damping: 11 });
  b.g.scale.multiplyScalar(Math.max(0.0001, appear));
  const eating = FRIES.some((f) => f.to === "baby" && t >= f.at && t < (f.carry ? f.carry[1] : f.at + f.dur));
  babyBits(b, { eating, melon: within(72, 104) });
  return { ...b, pos };
}

function starMesh(size, color) {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.45 : 1, a = (i / 10) * TAU + Math.PI / 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.25, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 1 });
  geo.center();
  const m = new THREE.Mesh(geo, toon(color));
  m.scale.setScalar(size);
  return m;
}

const mouthOf = (who) => {
  const c = who === "me" ? ME : who === "anna" ? ANNA : BABY;
  if (!c) return FRY_BOX.clone();
  const local = c.mouthLocal ? c.mouthLocal.clone() : new THREE.Vector3(0, 0.62, 0.55);
  c.g.updateMatrixWorld(true);
  return local.applyMatrix4(c.g.matrixWorld);
};

// --- fries in flight -------------------------------------------------------
for (const f of FRIES) {
  const end = f.back ? f.back[1] : f.carry ? f.carry[1] : f.at + f.dur;
  if (t < f.at || t > end) continue;
  const fry = add(new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.36, 0.05), fryMat), scene);
  const from = FRY_BOX.clone().add(new THREE.Vector3(0, 0.45, 0));
  if (t < f.at + f.dur) {
    const u = easeOut((t - f.at) / f.dur);
    const to = mouthOf(f.to);
    fry.position.lerpVectors(from, to, u);
    fry.position.y += Math.sin(Math.PI * u) * 0.8;
    fry.rotation.set(u * 6, 0, u * 3);
  } else if (f.carry && t < f.carry[1]) {
    fry.position.copy(mouthOf(f.to));
    const d = f.to === "baby" ? BABY : f.to === "anna" ? ANNA : ME;
    fry.rotation.set(Math.PI / 2, (d?.g.rotation.y || 0) + Math.PI / 2, 0);
  } else if (f.back && t < f.back[1]) {
    const u = easeInOut((t - f.back[0]) / (f.back[1] - f.back[0]));
    fry.position.lerpVectors(mouthOf("anna"), mouthOf("me"), u);
    fry.position.y += Math.sin(Math.PI * u) * 0.7;
    fry.rotation.set(-u * 6, 0, 0);
  } else {
    fry.visible = false;
  }
  if (!f.carry && t >= f.at + f.dur) fry.visible = false;
}

    g.position.set(Math.cos(ang + drift) * rad, 6 + r() * 4, -Math.abs(Math.sin(ang + drift)) * rad - 10);
    for (let i = 0; i < 4; i++) {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(0.8 + r() * 0.5, 14, 10), toon(mixColor("#fff6ee", "#7c74b8")(night)));
      puff.position.set(i * 0.9 - 1.3, r() * 0.35, r() * 0.4);
      g.add(puff);
    }
    scene.add(g);
  }
}

renderer.render(scene, camera);

// ---------------------------------------------------------------------------
// DOM: bubbles, captions, chapter cards
// ---------------------------------------------------------------------------
const toScreen = (v) => {
  const p = v.clone().project(camera);
  return [(p.x * 0.5 + 0.5) * W, (-p.y * 0.5 + 0.5) * H];
};

const bubbleLayer = document.getElementById("bubbles");
function drawBubbles(list, now, find) {
  for (const b of list) {
    if (now < b.at || now > b.to + 0.3) continue;
    const c = find(b.who);
    if (!c) continue;
    c.g.updateMatrixWorld(true);
    const head = new THREE.Vector3(0, (c.top || 1.2) + 0.25, 0).applyMatrix4(c.g.matrixWorld);
    const [x, y] = toScreen(head);
    const s = popInOut(b.at, b.to, { stiffness: 420, damping: 15 }, 0.3, now);
    const el = document.createElement("div");
    el.className = "bubble";
    el.textContent = b.text;
    bubbleLayer.append(el);
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.transform = `translate(${x - w / 2}px, ${y - h - 14}px) scale(${Math.max(0, s)})`;
    el.style.opacity = String(Math.min(1, s * 1.5));
  }
}
if (inAdv) drawBubbles(ADV_BUBBLES, rawT, (who) => advObjects[who]);
else drawBubbles(BUBBLES, t, (who) => (who === "me" ? ME : who === "anna" ? ANNA : BABY));

const capLayer = document.getElementById("captions");
capLayer.classList.toggle("night", night > 0.45);
function drawCaptions(list, now) {
  for (const c of list) {
    if (now < c.at || now > c.to + 0.4) continue;
    const line = document.createElement("div");
    line.className = "line" + (c.s ? " " + c.s : "");
    const words = c.text.split(" ");
    const out = easeIn(span(c.to, c.to + 0.35, now));
    const stagger = c.s === "big" ? 0.14 : 0.075;
    words.forEach((w, i) => {
      const el = document.createElement("span");
      el.className = "word";
      el.textContent = w;
      const e = now - c.at - i * stagger;
      /* Framer-style pop: y and scale on a bouncy spring, opacity on a quick ease */
      const y = springAt(e, 1, 0, { stiffness: 380, damping: 13 });
      const sc = springAt(e, 0.4, 1, { stiffness: 420, damping: 11 });
      const op = easeOut(clamp01(e / 0.12));
      el.style.transform = `translateY(${y * 0.6 + out * 0.4}em) scale(${e <= 0 ? 0.4 : sc}) rotate(${(1 - Math.min(1, sc)) * (i % 2 ? 6 : -6)}deg)`;
      el.style.opacity = String(op * (1 - out));
      line.append(el);
    });
    capLayer.append(line);
  }
}
if (inAdv) drawCaptions(ADV_CAPTIONS, rawT);
else drawCaptions(CAPTIONS, t);

/* the real photos, as polaroids */
const pending = [];
if (rawT >= POLAROID_AT) {
  const layer = document.getElementById("photos");
  POLAROIDS.forEach((p, i) => {
    const e = rawT - POLAROID_AT - i * 0.32;
    if (e <= 0) return;
    const el = document.createElement("figure");
    el.className = "polaroid";
    const img = new Image();
    img.src = `photos/${p.src}.jpg`;
    pending.push(img.decode().catch(() => {}));
    const cap = document.createElement("figcaption");
    cap.textContent = p.label;
    el.append(img, cap);
    const k = springAt(e, 0, 1, { stiffness: 190, damping: 14 });
    const fromY = 70 * (1 - k);
    el.style.left = p.x + "vw";
    el.style.top = p.y + "vh";
    el.style.transform = `translate(-50%, calc(-50% + ${fromY}vh)) rotate(${p.r + (1 - k) * (i % 2 ? 22 : -22)}deg) scale(${0.7 + 0.3 * k})`;
    el.style.opacity = String(clamp01(e / 0.15));
    layer.append(el);
  });
}

const card = document.getElementById("card");
const CARDS_VIDEO = [
  ...CARDS.map((c) => ({ ...c, at: c.at >= ADV ? c.at + ADV_LEN : c.at })),
  { at: ADV, n: "Chapter two and a half", title: "Adventures" },
];
for (const c of CARDS_VIDEO) {
  if (rawT < c.at || rawT >= c.at + CARD_LEN) continue;
  card.hidden = false;
  card.querySelector(".n").textContent = c.n;
  card.querySelector(".t").textContent = c.title;
  const e = rawT - c.at;
  const inY = springAt(e, 1, 0, { stiffness: 170, damping: 22 });
  const outY = easeInOut(span(c.at + CARD_LEN - 0.55, c.at + CARD_LEN, rawT));
  card.style.transform = `translateY(${(inY * 100 - outY * 100).toFixed(3)}%)`;
  const inner = springAt(e - 0.25, 0, 1, { stiffness: 300, damping: 12 });
  card.querySelector(".t").style.transform = `scale(${inner}) rotate(${(1 - inner) * -4}deg)`;
  card.querySelector(".n").style.opacity = String(clamp01((e - 0.2) / 0.3));
  card.querySelector("svg").style.transform = `scale(${springAt(e - 0.55, 0, 1, { stiffness: 380, damping: 8 }) * (1 + Math.sin(e * 6) * 0.06)})`;
}

/* A soft fade in from cream at the very start. */
if (t < 1) {
  document.getElementById("fx").style.background =
    `rgba(255,246,236,${1 - easeOut(t)})`;
}

await Promise.all(pending);
document.documentElement.setAttribute("data-seekreel-ready", "1");
</script>
