<meta charset="utf-8">
<title>seekreel — three.js stage</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b0d10; }
  canvas { display: block; width: 1080px; height: 1080px; }
  #label {
    position: absolute; left: 64px; bottom: 56px;
    font: 400 20px/1.6 ui-monospace, "SF Mono", monospace;
    color: #8b949e; letter-spacing: -0.03em;
  }
  #label b { color: #f0f6fc; font-weight: 600; }
</style>

<canvas id="view" width="1080" height="1080"></canvas>
<div id="label">three.js · frame <b id="frame">0</b> · t <b id="time">0.000</b></div>

<script type="module">
/*
 * A three.js stage.
 *
 * The contract does not change for 3D: read `t`, draw that moment, say when the
 * frame is final. What changes is what "draw that moment" means — a renderer
 * that is normally driven by requestAnimationFrame is instead asked for exactly
 * one frame, with every transform computed from the timestamp.
 *
 * Nothing here accumulates. There is no `rotation.y += 0.01`, because frame 300
 * has to be the same picture whether it was rendered after frame 299 or on its
 * own, in a fresh page, six months later. Every value below is arithmetic on t.
 *
 * Note the import: stages are served over loopback, so an ES module import
 * works. That is the whole reason three.js can be used at all.
 */
import * as THREE from "./three.module.js";

const DURATION = 8;
const FPS = 24;
const t = parseFloat(new URLSearchParams(location.search).get("t") || "0");
const turn = t / DURATION; // one full revolution over the film

const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(1080, 1080, false);
renderer.setClearColor(0x0b0d10, 1);
/* Colour management on, so the render matches what a browser would show. */
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0d10, 13, 26);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
/* The camera orbits rather than the object spinning: the same picture, and it
   keeps the lighting stable across the film. */
const angle = turn * Math.PI * 2;
camera.position.set(Math.sin(angle) * 11.5, 4.4 + Math.sin(turn * Math.PI * 4) * 1.1, Math.cos(angle) * 11.5);
camera.lookAt(0, 1.1, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, 6, 3);
scene.add(key);
const rim = new THREE.DirectionalLight(0xd946a6, 2.0);
rim.position.set(-5, 2, -4);
scene.add(rim);

/* A ring of bars, each one rising on its own delay — the 3D version of a
   stagger, and the thing that makes it obvious the film is seeked rather than
   played. */
const COUNT = 18;
const bars = new THREE.Group();
for (let i = 0; i < COUNT; i++) {
  const phase = i / COUNT;
  /* Progress through this bar's own window, clamped: the same `span` helper the
     DOM stages use, in three dimensions. */
  const from = 0.15 + phase * 0.5;
  const rise = Math.min(1, Math.max(0, (t - from) / 1.4));
  const eased = 1 - Math.pow(1 - rise, 4);
  const height = 0.4 + eased * (1.2 + Math.sin(phase * Math.PI * 3) * 0.9);

  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.42, height, 0.42),
    new THREE.MeshStandardMaterial({
      color: i % 3 === 0 ? 0xd946a6 : 0xf0f6fc,
      roughness: 0.35,
      metalness: 0.1,
    }),
  );
  const around = phase * Math.PI * 2;
  bar.position.set(Math.sin(around) * 3.1, height / 2, Math.cos(around) * 3.1);
  bar.rotation.y = -around;
  bars.add(bar);
}
scene.add(bars);

/* The floor, and a wireframe sphere that breathes on the same clock. */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6.4, 64),
  new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.9 }),
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const pulse = 1 + Math.sin(t * Math.PI * 0.75) * 0.08;
const shell = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.5 * pulse, 2),
  new THREE.MeshBasicMaterial({ color: 0xd946a6, wireframe: true, transparent: true, opacity: 0.55 }),
);
shell.position.y = 1.5;
shell.rotation.set(t * 0.3, t * 0.42, 0);
scene.add(shell);

renderer.render(scene, camera);

document.getElementById("frame").textContent = String(Math.round(t * FPS));
document.getElementById("time").textContent = t.toFixed(3);

/*
 * Ready only after the draw. WebGL hands the frame to the compositor when the
 * task ends, and the screenshot happens after that — but the flag still belongs
 * here, after `render`, not before it.
 */
document.documentElement.setAttribute("data-seekreel-ready", "1");
</script>
